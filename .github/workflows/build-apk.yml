name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk IPTVSmart.apk

      - uses: actions/upload-artifact@v4
        with:
          name: IPTVSmart-apk
          path: IPTVSmart.apk

      # Sur main, publie l'APK dans la release "latest" pour le télécharger
      # directement depuis le téléphone.
      - name: Publish latest release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: IPTV Smart (dernière version)
          body: "Build ${{ github.run_number }} — commit ${{ github.sha }}"
          prerelease: false
          make_latest: true
          files: IPTVSmart.apk
