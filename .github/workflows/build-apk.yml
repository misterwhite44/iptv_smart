name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
      UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
      OPENSUBTITLES_API_KEY: ${{ secrets.OPENSUBTITLES_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Historique complet et tags, pour écrire les notes de version.
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk Zynora.apk
          # Ancien nom gardé pour que les liens déjà partagés restent à jour.
          cp Zynora.apk IPTVSmart.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Zynora-apk
          path: Zynora.apk

      # Fichier AAB pour le Play Store, signé avec la clé d'importation privée.
      # Ne tourne que si les secrets existent ; l'AAB n'est jamais publié dans la release.
      - name: Build AAB (Play Store)
        if: env.UPLOAD_KEYSTORE_BASE64 != ''
        run: |
          echo "$UPLOAD_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.keystore"
          UPLOAD_KEYSTORE_FILE="$RUNNER_TEMP/upload.keystore" ./gradlew --no-daemon bundleRelease -PplayUpload=true
          cp app/build/outputs/bundle/release/app-release.aab Zynora.aab

      - uses: actions/upload-artifact@v4
        if: hashFiles('Zynora.aab') != ''
        with:
          name: Zynora-aab
          path: Zynora.aab

      # APK de démonstration séparé (catalogue libre de droits intégré, identifiant
      # com.zynora.app.demo), installable à côté de l'appli normale.
      - name: Build demo APK
        run: |
          ./gradlew --no-daemon assembleRelease -Pdemo=true
          cp app/build/outputs/apk/release/app-release.apk Zynora-Demo.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Zynora-demo-apk
          path: Zynora-Demo.apk

      # Notes de version : la section « ## Prochaine version » du CHANGELOG si
      # elle existe, sinon les messages des commits depuis la version
      # précédente (tag v0.1.N), sans les commits de fusion ni les mentions
      # de co-auteur.
      - name: Release notes
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          VERSION="0.1.${{ github.run_number }}"
          NEXT=$(awk '/^## /{p=($0=="## Prochaine version")} p&&!/^## /' CHANGELOG.md)
          {
            echo "Zynora $VERSION — $(date -u +%d/%m/%Y)"
            echo
            if [ -n "$(echo "$NEXT" | tr -d '[:space:]')" ]; then
              echo "$NEXT"
            else
              PREV=$(git describe --tags --abbrev=0 --match 'v0.1.*' HEAD 2>/dev/null || true)
              if [ "$PREV" = "v$VERSION" ]; then
                PREV=$(git describe --tags --abbrev=0 --match 'v0.1.*' HEAD^ 2>/dev/null || true)
              fi
              # Sans version précédente, seulement les commits apportés par ce push.
              git log "${PREV:-HEAD^}..HEAD" --no-merges --format='### %s%n%n%b' \
                | grep -v -E '^(Co-Authored-By|Claude-Session):'
            fi
            echo
            echo "Historique complet : [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)"
          } > release-notes.md
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          cat release-notes.md

      # Une release par version (v0.1.N), pour garder l'historique.
      - name: Publish versioned release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: Zynora ${{ env.VERSION }}
          body_path: release-notes.md
          prerelease: false
          make_latest: false
          files: Zynora.apk

      # Sur main, publie aussi l'APK dans la release "latest" pour le
      # télécharger directement depuis le téléphone (lien qui ne change pas).
      - name: Publish latest release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Zynora (dernière version)
          body_path: release-notes.md
          prerelease: false
          make_latest: true
          files: |
            Zynora.apk
            IPTVSmart.apk

      - name: Publish demo release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: demo
          name: Zynora IPTV Démo
          body: |
            APK de démonstration de Zynora ${{ env.VERSION }}, à installer à côté de l'appli normale.
            Sur l'écran du fournisseur, appuie sur « Ouvrir le catalogue de démonstration » :
            films ouverts de la Blender Foundation (CC BY) et flux HLS de test publics.
          prerelease: false
          make_latest: false
          files: Zynora-Demo.apk

      # Remplace « ## Prochaine version » par le numéro de cette version dans
      # le CHANGELOG. Si main a bougé entre-temps, le push est refusé sans
      # casser le build : le build suivant, qui contient aussi ces lignes,
      # remplacera le titre.
      - name: Stamp CHANGELOG
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          grep -q '^## Prochaine version$' CHANGELOG.md || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          sed -i "s|^## Prochaine version\$|## $VERSION — $(date -u +%d/%m/%Y)|" CHANGELOG.md
          git commit -am "CHANGELOG : version $VERSION" \
            && git push origin HEAD:refs/heads/main \
            || echo "::warning::CHANGELOG non mis à jour"
