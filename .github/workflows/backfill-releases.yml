name: Backfill releases

# À lancer une fois à la main : crée les releases v0.1.N des versions
# sorties avant la publication automatique des versions.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/backfill_releases.py
