name: Captures Play Store

# Captures d'écran de la fiche Play Store, prises sur un émulateur Android avec
# l'APK démo (catalogue libre de droits). Résultat : artifact « captures-play-store ».
on:
  workflow_dispatch:
  push:
    branches: [ claude/project-thread-tih42a ]
    paths:
      - .github/workflows/screenshots.yml
      - scripts/play_screenshots.py

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build demo APK
        run: ./gradlew --no-daemon assembleDebug -Pdemo=true

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Take screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb shell wm size 1080x1920
            adb shell wm density 420
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            mkdir -p screenshots
            python3 scripts/play_screenshots.py 2>&1 | tee screenshots/log.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: captures-play-store
          path: screenshots/

      # Les captures sont aussi poussées sur la branche « play-screenshots »,
      # pour les récupérer sans télécharger l'artifact.
      - name: Push screenshots branch
        if: always()
        run: |
          cd screenshots
          git init -q -b play-screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Captures Play Store (${{ github.sha }})"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" play-screenshots
